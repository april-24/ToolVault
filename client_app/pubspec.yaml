name: tool_vault_client
description: Resident-facing mobile prototype for the Tool Vault township tool-sharing service.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tools/
    - assets/tool_vault_logo.png
